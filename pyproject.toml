[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pandas-commit-linter"
version = "0.1.0"
description = "A pandas DataFrame accessor for linting GitHub commit messages."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pandas>=1.5"]
authors = [{ name = "ZoubidaChk" }]
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/pandas_commit_linter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
